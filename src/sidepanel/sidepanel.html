<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Manager</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search tabs..." autocomplete="off">
      </div>
      <div class="header-actions">
        <button id="locateCurrentBtn" class="icon-btn" title="Locate current tab">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5" fill="none"/>
            <circle cx="8" cy="8" r="2" fill="currentColor"/>
          </svg>
        </button>
        <button id="syncSidebarBtn" class="icon-btn" title="Toggle sidebar in all windows">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <rect x="1" y="2" width="6" height="5" rx="1" stroke="currentColor" stroke-width="1" fill="none"/>
            <rect x="9" y="2" width="6" height="5" rx="1" stroke="currentColor" stroke-width="1" fill="none"/>
            <rect x="1" y="9" width="6" height="5" rx="1" stroke="currentColor" stroke-width="1" fill="none"/>
            <rect x="9" y="9" width="6" height="5" rx="1" stroke="currentColor" stroke-width="1" fill="none"/>
          </svg>
        </button>
        <button id="sessionsBtn" class="icon-btn" title="Sessions">💾</button>
        <button id="collapseWindowsBtn" class="icon-btn" title="Collapse/Expand all windows">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <rect x="2" y="2" width="12" height="3" rx="1"/>
            <rect x="2" y="7" width="12" height="3" rx="1"/>
            <rect x="2" y="12" width="12" height="2" rx="1"/>
          </svg>
        </button>
        <button id="collapseAllBtn" class="icon-btn" title="Collapse all groups">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M4 6l4 4 4-4H4z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Tab List -->
    <main class="tab-list-container">
      <div id="tabList" class="tab-list">
        <!-- Tabs will be rendered here -->
      </div>
    </main>

    <!-- Footer Stats -->
    <footer class="footer">
      <span id="tabStats">0 tabs</span>
      <button id="settingsBtn" class="footer-btn" title="Settings">⚙️</button>
    </footer>
  </div>

  <script src="sidepanel.js" type="module"></script>
</body>
</html>
